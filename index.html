<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STEM Festival Bingo</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="sky">

    <div class="sun"></div>

    <div id="cloudLayer"></div>

</div>



<div class="content">


    <img 
        src="assets/steam_logo_color.png"
        class="festival-logo"
        alt="STEAM Festival Logo"
    >


	<section id="festivalMapSection">

		<img id="festivalMap" src="assets/festival_map.png">

		<!-- Icons are drawn here -->
		<div id="mapIcons"></div>

	</section>

	<section id="mapDirectory">

		<!-- Generated from map.csv -->
	</section>

	<div id="mapPopup" class="hidden">
		<button id="closePopup">✕</button>

		<h2 id="popupTitle"></h2>

		<p id="popupDescription"></p>

		<img id="popupImage">

		<a id="popupLink" target="_blank">Learn More</a>

	</div>

<img id="passport"...>


    <h1>
        STEM Festival Bingo
    </h1>


    <p>
        Explore. Discover. Learn.
    </p>


</div>

<div class="passport-container">

    <div id="bingo"></div>

</div>

<button onclick="resetCard()" class="reset-button">

    🔄 Reset Passport

</button>

<div id="schedule"></div>

<script src="sky.js"></script>
<script src="bingo.js"></script>
<script src="schedule.js"></script>
<script src="map.js"></script>


</body>

</html>
